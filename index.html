<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Breakout Finder</title><style>body{font-family:Arial;background:#0b0d10;color:#fff;margin:0}main{max-width:1200px;margin:auto;padding:30px}.card{background:#15191f;border:1px solid #29303a;border-radius:16px;padding:20px}input,select,button{padding:12px;border-radius:9px;border:1px solid #333;background:#0e1116;color:#fff;margin:5px}button{background:#fff;color:#111;font-weight:700}.row{display:flex;flex-wrap:wrap}.grow{flex:2;min-width:220px}.status{color:#aaa;margin:15px 5px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #292f37;text-align:left}img{width:120px;border-radius:7px}.badge{padding:5px 8px;border-radius:20px;background:#26313a}.hot{background:#5a1d20}small{color:#999}</style></head><body><main><h1>YouTube Breakout Finder</h1><p><small>Find videos outperforming a channel's normal views.</small></p><div class="card"><div class="row"><input class="grow" id="q" placeholder="Niche e.g. Ancient Rome"><select id="type"><option value="any">All videos</option><option value="short">Shorts ≤60s</option><option value="long">Long-form</option></select><select id="days"><option value="30">30 days</option><option value="90" selected>90 days</option><option value="365">1 year</option></select><input id="min" type="number" value="10000" placeholder="Min views"><button id="go">Find Breakouts</button></div><div class="row"><input class="grow" type="password" id="key" placeholder="YouTube Data API v3 key"><button id="save">Save key</button></div><div class="status" id="status">Ready.</div><table><thead><tr><th>Video</th><th>Title / Channel</th><th>Views</th><th>Typical</th><th>Breakout</th></tr></thead><tbody id="out"></tbody></table></div></main><script>
const $=x=>document.querySelector(x),fmt=n=>Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(n||0),med=a=>{a=a.sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length?(a.length%2?a[m]:(a[m-1]+a[m])/2):0};$("#key").value=localStorage.ytk||"";$("#save").onclick=()=>{localStorage.ytk=$("#key").value.trim();$("#status").textContent="Key saved in this browser."};async function api(p,x){let k=$("#key").value.trim();if(!k)throw Error("Add a YouTube Data API key first.");let u=new URL("https://www.googleapis.com/youtube/v3/"+p);Object.entries({...x,key:k}).forEach(([a,b])=>u.searchParams.set(a,b));let r=await fetch(u),j=await r.json();if(!r.ok)throw Error(j.error?.message||"API error");return j}async function videos(ids,part="snippet,statistics,contentDetails"){let j=await api("videos",{part,id:ids.join(",")});return j.items||[]}function secs(s){let m=s.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);return(+m?.[1]||0)*3600+(+m?.[2]||0)*60+(+m?.[3]||0)}async function baseline(c){let s=await api("search",{part:"snippet",channelId:c,type:"video",order:"date",maxResults:15}),v=await videos(s.items.map(x=>x.id.videoId).filter(Boolean),"statistics");return med(v.map(x=>+x.statistics?.viewCount||0).filter(Boolean))}$("#go").onclick=async()=>{try{let q=$("#q").value.trim();if(!q)throw Error("Enter a niche.");$("#status").textContent="Searching YouTube…";$("#out").innerHTML="";let after=new Date(Date.now()-+$("#days").value*86400000).toISOString(),s=await api("search",{part:"snippet",q,type:"video",order:"relevance",maxResults:25,publishedAfter:after}),v=await videos(s.items.map(x=>x.id.videoId).filter(Boolean)),cs=[...new Set(v.map(x=>x.snippet.channelId))],b={};for(let i=0;i<cs.length;i++){ $("#status").textContent="Analyzing channels "+(i+1)+"/"+cs.length+"…";try{b[cs[i]]=await baseline(cs[i])}catch{b[cs[i]]=0}}let typ=$("#type").value,min=+$("#min").value||0,d=v.map(x=>{let view=+x.statistics?.viewCount||0,base=b[x.snippet.channelId]||0,sec=secs(x.contentDetails.duration);return{x,view,base,m:base?view/base:0,sec}}).filter(z=>z.view>=min&&(typ==="any"||(typ==="short"?z.sec<=60:z.sec>60))).sort((a,b)=>b.m-a.m);for(let z of d){let x=z.x,tr=document.createElement("tr");tr.innerHTML='<td><img src="'+x.snippet.thumbnails.medium.url+'"></td><td><b>'+x.snippet.title+'</b><br><small>'+x.snippet.channelTitle+'</small></td><td>'+fmt(z.view)+'</td><td>'+fmt(z.base)+'</td><td><span class="badge '+(z.m>=10?"hot":"")+'">'+z.m.toFixed(1)+'×</span></td>';$("#out").appendChild(tr)}$("#status").textContent="Done — "+d.length+" results ranked by breakout multiple."}catch(e){$("#status").textContent="Error: "+e.message}}</script></body></html>
