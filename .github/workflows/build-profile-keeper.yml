name: Build Profile Keeper APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [profile-keeper-android-build]
    paths:
      - 'profile-keeper-android/**'
      - '.github/workflows/build-profile-keeper.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: profile-keeper-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfileKeeper-APK
          path: profile-keeper-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
