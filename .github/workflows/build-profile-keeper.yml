name: Build Profile Keeper APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [profile-keeper-android-build]
    paths:
      - 'profile-keeper-android/**'
      - '.github/workflows/build-profile-keeper.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          MANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: profile-keeper-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfileKeeper-APK
          path: profile-keeper-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download on isolated branch
        run: |
          cp profile-keeper-android/app/build/outputs/apk/debug/app-debug.apk /tmp/ProfileKeeper.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan profile-keeper-download
          git rm -rf --ignore-unmatch .
          cp /tmp/ProfileKeeper.apk ProfileKeeper.apk
          git add ProfileKeeper.apk
          git commit -m "Publish direct-install Profile Keeper APK"
          git push --force origin HEAD:profile-keeper-apk
